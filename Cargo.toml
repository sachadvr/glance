[package]
name = "glance"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A git pager and branch browser for the terminal: diffs, logs, stashes and blames you can click through."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sachadvr/glance"
homepage = "https://github.com/sachadvr/glance"
readme = "README.md"
keywords = ["git", "tui", "pager", "diff", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".claude/", ".github/", "CLAUDE.md", "docs/", "scripts/"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
# Only to point stdin back at the terminal once the pipe is drained (see main.rs); crossterm already depends on it.
rustix = { version = "1.1.5", default-features = false, features = ["std", "stdio"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2.2"

[profile.release]
lto = true
codegen-units = 1
# Some rustup toolchains ship a rust-objcopy that cannot load libLLVM: stripping would fail their release builds.
strip = false
