[package]
name = "glance"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A git pager and branch browser for the terminal: diffs, logs, stashes and blames you can click through."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sachadvr/glance"
homepage = "https://github.com/sachadvr/glance"
readme = "README.md"
keywords = ["git", "tui", "pager", "diff", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".claude/", ".github/", "CLAUDE.md", "docs/", "scripts/"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2.2"

[profile.release]
lto = true
codegen-units = 1
# Some rustup toolchains ship a rust-objcopy that cannot load libLLVM: stripping would fail their release builds.
strip = false
